<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Teacher Login - Hassel Edu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold logo" href="index.html">
                Hassel<span>Edu</span>
            </a>

            <a href="index.html" class="btn btn-outline-orange">
                ← Back to Home
            </a>

        </div>

    </nav>


    <section class="login-section d-flex align-items-center">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card login-card border-0 shadow-lg rounded-4">

                        <div class="card-body p-5">

                            <div class="login-icon mb-4">
                                👩‍🏫
                            </div>

                            <div class="text-center">

                                <h2 class="fw-bold">
                                    Teacher Login
                                </h2>

                                <p class="text-secondary">
                                    Login to your Hassel Edu teacher account
                                </p>

                            </div>


                            <form class="mt-4">

                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Email Address
                                    </label>

                                    <input type="email"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your email"
                                        required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Password
                                    </label>

                                    <input type="password"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your password"
                                        required>

                                </div>


                                <div class="d-flex justify-content-between align-items-center mb-4">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                            type="checkbox"
                                            id="remember">

                                        <label class="form-check-label"
                                            for="remember">
                                            Remember me
                                        </label>

                                    </div>

                                    <a href="#" class="orange-link">
                                        Forgot Password?
                                    </a>

                                </div>


                                <button type="submit"
                                    class="btn btn-orange btn-lg w-100">
                                    Login as Teacher →
                                </button>

                            </form>


                            <div class="text-center mt-4">

                                <p class="text-secondary mb-2">
                                    Don't have a teacher account?
                                </p>

                               <a href="teacher-register.html" class="orange-link fw-semibold">
                                Register as a Teacher
                               </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
