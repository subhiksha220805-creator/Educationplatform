<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <meta name="description"
        content="Create an EduKids account and start learning with fun educational activities.">

    <title>EduKids | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">


    <nav class="navbar bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold logo"
                href="index.html">

                Edu<span>Kids</span>

            </a>

            <a href="index.html"
                class="btn btn-outline-orange">

                Home

            </a>

        </div>

    </nav>


    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center align-items-center min-vh-100">

                <div class="col-md-8 col-lg-6">

                    <div class="login-card bg-white shadow-lg rounded-4 p-4 p-md-5">

                        <div class="text-center">

                            <div class="login-icon">
                                🌟
                            </div>

                            <h1 class="fw-bold mt-3">
                                Create Your Account
                            </h1>

                            <p class="text-secondary">
                                Join EduKids and start learning!
                            </p>

                        </div>


                        <form onsubmit="registerUser(event)">


                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Full Name
                                </label>

                                <input type="text"
                                    id="registerName"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your name"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <input type="email"
                                    id="registerEmail"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <input type="password"
                                    id="registerPassword"
                                    class="form-control form-control-lg"
                                    placeholder="Create a password"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Confirm Password
                                </label>

                                <input type="password"
                                    id="confirmPassword"
                                    class="form-control form-control-lg"
                                    placeholder="Confirm your password"
                                    required>

                            </div>


                            <div id="registerMessage"
                                class="mb-3 text-center">
                            </div>


                            <button type="submit"
                                class="btn btn-orange btn-lg w-100">

                                Create Account

                            </button>


                        </form>


                        <div class="text-center mt-4">

                            <p class="mb-0 text-secondary">

                                Already have an account?

                                <a href="login.html"
                                    class="orange-link fw-bold">

                                    Login

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
