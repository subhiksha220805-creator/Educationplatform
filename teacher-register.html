<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Teacher Registration - Hassel Edu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold logo" href="index.html">
                Hassel<span>Edu</span>
            </a>

            <a href="teacher-login.html" class="btn btn-outline-orange">
                ← Teacher Login
            </a>

        </div>

    </nav>


    <section class="login-section d-flex align-items-center py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-7 col-lg-6">

                    <div class="card login-card border-0 shadow-lg rounded-4">

                        <div class="card-body p-5">

                            <div class="login-icon mb-4">
                                👩‍🏫
                            </div>

                            <div class="text-center">

                                <h2 class="fw-bold">
                                    Teacher Registration
                                </h2>

                                <p class="text-secondary">
                                    Create your Hassel Edu teacher account
                                </p>

                            </div>


                            <form class="mt-4">

                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Full Name
                                    </label>

                                    <input type="text"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your full name"
                                        required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Email Address
                                    </label>

                                    <input type="email"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your email"
                                        required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Phone Number
                                    </label>

                                    <input type="tel"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your phone number"
                                        required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Subject
                                    </label>

                                    <select class="form-select form-select-lg"
                                        required>

                                        <option value="">
                                            Select your subject
                                        </option>

                                        <option>
                                            Mathematics
                                        </option>

                                        <option>
                                            Science
                                        </option>

                                        <option>
                                            English
                                        </option>

                                        <option>
                                            Creativity
                                        </option>

                                        <option>
                                            General Knowledge
                                        </option>

                                    </select>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label fw-semibold">
                                        Password
                                    </label>

                                    <input type="password"
                                        class="form-control form-control-lg"
                                        placeholder="Create a password"
                                        required>

                                </div>


                                <div class="mb-4">

                                    <label class="form-label fw-semibold">
                                        Confirm Password
                                    </label>

                                    <input type="password"
                                        class="form-control form-control-lg"
                                        placeholder="Confirm your password"
                                        required>

                                </div>


                                <div class="form-check mb-4">

                                    <input class="form-check-input"
                                        type="checkbox"
                                        id="terms"
                                        required>

                                    <label class="form-check-label"
                                        for="terms">
                                        I agree to the terms and conditions
                                    </label>

                                </div>


                                <button type="submit"
                                    class="btn btn-orange btn-lg w-100">
                                    Create Teacher Account →
                                </button>

                            </form>


                            <div class="text-center mt-4">

                                <p class="text-secondary mb-2">
                                    Already have a teacher account?
                                </p>

                                <a href="teacher-login.html"
                                    class="orange-link fw-semibold">
                                    Login as a Teacher
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
